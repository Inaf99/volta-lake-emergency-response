<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volta Lake Emergency Response — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .auth-wrap{max-width:420px;margin:60px auto;padding:0 20px;}
  .auth-card{border:1px solid var(--border);background:var(--bg-panel);border-radius:14px;padding:28px;}
  .auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .auth-tabs{display:flex;gap:4px;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px;}
  .auth-tabs button{flex:1;background:transparent;border:none;color:var(--text-1);font-weight:700;font-size:12.5px;padding:9px;border-radius:7px;cursor:pointer;}
  .auth-tabs button.active{background:var(--bg-panel);color:var(--text-0);}
  form{display:none;}
  form.active{display:block;}
  .demo-note{font-size:11.5px;color:var(--text-2);text-align:center;margin-top:16px;line-height:1.6;}
  .demo-note code{color:var(--water);font-family:var(--mono);}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <div class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2C8 6.5 5 10.5 5 14a7 7 0 0014 0c0-3.5-3-7.5-7-12z" fill="#031311"/></svg></div>
    <div class="brand-text">
      <div class="name">Volta Lake Emergency Response</div>
      <div class="sub">LAERS · class project prototype</div>
    </div>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Sign in</button>
      <button id="tabRegister" onclick="switchTab('register')">Create account</button>
    </div>

    <div id="errorBox"></div>

    <form id="loginForm" class="active">
      <div class="form-row"><label>Phone number</label><input type="text" id="loginPhone" placeholder="+233240000001" required></div>
      <div class="form-row"><label>Password</label><input type="password" id="loginPassword" placeholder="password123" required></div>
      <button type="submit" class="btn btn-critical" style="width:100%;">Sign in</button>
    </form>

    <form id="registerForm">
      <div class="form-row"><label>Full name</label><input type="text" id="regName" required></div>
      <div class="form-row"><label>Phone number</label><input type="text" id="regPhone" placeholder="+233240000099" required></div>
      <div class="form-row"><label>Email (optional)</label><input type="email" id="regEmail"></div>
      <div class="form-row">
        <label>I am a</label>
        <select id="regRole">
          <option value="PASSENGER">Passenger</option>
          <option value="BOAT_OPERATOR">Boat operator</option>
          <option value="RESPONDER">Emergency responder</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
      <div class="form-row"><label>Password</label><input type="password" id="regPassword" required></div>
      <button type="submit" class="btn btn-critical" style="width:100%;">Create account</button>
    </form>

    <div class="demo-note">
      Demo accounts (after <code>npm run seed</code>): any of the numbers
      above with password <code>password123</code>. Admin: <code>+233240000001</code>.
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/toast.js"></script>
<script>
  // If already logged in, skip straight to the right dashboard.
  const existing = getSession();
  if (existing) window.location.href = roleHome(existing.user.role);

  function switchTab(which){
    document.getElementById('tabLogin').classList.toggle('active', which==='login');
    document.getElementById('tabRegister').classList.toggle('active', which==='register');
    document.getElementById('loginForm').classList.toggle('active', which==='login');
    document.getElementById('registerForm').classList.toggle('active', which==='register');
    document.getElementById('errorBox').innerHTML='';
  }
  function showError(msg){
    document.getElementById('errorBox').innerHTML = `<div class="error-banner">${msg}</div>`;
  }

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    showError('');
    try{
      const { user, token } = await api.login({
        phone: document.getElementById('loginPhone').value.trim(),
        password: document.getElementById('loginPassword').value,
      });
      saveSession(user, token);
      window.location.href = roleHome(user.role);
    }catch(err){ showError(err.message); }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    showError('');
    try{
      const { user, token } = await api.register({
        full_name: document.getElementById('regName').value.trim(),
        phone: document.getElementById('regPhone').value.trim(),
        email: document.getElementById('regEmail').value.trim() || undefined,
        role: document.getElementById('regRole').value,
        password: document.getElementById('regPassword').value,
      });
      saveSession(user, token);
      window.location.href = roleHome(user.role);
    }catch(err){ showError(err.message); }
  });
</script>
</body>
</html>
